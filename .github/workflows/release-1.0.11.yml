name: Build AdviDesk Suite 1.0.11 release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the tagged application source
        uses: actions/checkout@v4
        with:
          repository: RAMZY329/advidesk-suite
          ref: v1.0.11
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recreate the Class Track workspace source layout
        shell: pwsh
        run: |
          $workspaceRoot = Split-Path (Get-Location) -Parent
          $classTrackSource = Join-Path $workspaceRoot "Class Record 3 Lifetime No Duplicate"
          New-Item -ItemType Directory -Path $classTrackSource -Force | Out-Null
          Copy-Item -Path "class-track\*" -Destination $classTrackSource -Recurse -Force

      - name: Build the Windows updater installer
        run: npm run desktop:installer:update

      - name: Upload release assets in updater-safe order
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.11 --repo RAMZY329/advidesk-updates "release-auto-update-1.0.11\AdviDesk-Suite-Setup-1.0.11.exe" --clobber
          gh release upload v1.0.11 --repo RAMZY329/advidesk-updates "release-auto-update-1.0.11\AdviDesk-Suite-Setup-1.0.11.exe.blockmap" --clobber
          gh release upload v1.0.11 --repo RAMZY329/advidesk-updates "release-auto-update-1.0.11\latest.yml" --clobber
